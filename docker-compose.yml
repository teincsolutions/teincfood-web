name: teincfoodweb

services:
  teincfood-web:
    image: ${APP_IMAGE:-ghcr.io/teincsolutions/teincfoodweb:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_BUYER_APP_STORE: ${NEXT_PUBLIC_BUYER_APP_STORE:-}
        NEXT_PUBLIC_BUYER_PLAY_STORE: ${NEXT_PUBLIC_BUYER_PLAY_STORE:-}
        NEXT_PUBLIC_BUSINESS_APP_STORE: ${NEXT_PUBLIC_BUSINESS_APP_STORE:-}
        NEXT_PUBLIC_BUSINESS_PLAY_STORE: ${NEXT_PUBLIC_BUSINESS_PLAY_STORE:-}
        NEXT_PUBLIC_GOOGLE_ANALYTICS: ${NEXT_PUBLIC_GOOGLE_ANALYTICS:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_APPLE_CLIENT_ID: ${NEXT_PUBLIC_APPLE_CLIENT_ID:-}
        NEXT_PUBLIC_TELEMETRY_URL: ${NEXT_PUBLIC_TELEMETRY_URL:-}
        NEXT_PUBLIC_TELEMETRY_KEY: ${NEXT_PUBLIC_TELEMETRY_KEY:-}
        NEXT_PUBLIC_TELEMETRY_ENV: ${NEXT_PUBLIC_TELEMETRY_ENV:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    container_name: teincfood_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_TELEMETRY_URL: ${NEXT_PUBLIC_TELEMETRY_URL:-}
      NEXT_PUBLIC_TELEMETRY_ENV: ${NEXT_PUBLIC_TELEMETRY_ENV:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_APPLE_CLIENT_ID: ${NEXT_PUBLIC_APPLE_CLIENT_ID:-}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-hello@teincfood.com}
      TEINCFOOD_API_BASE_URL: ${TEINCFOOD_API_BASE_URL:-}
      TEINCFOOD_API_VERSION: ${TEINCFOOD_API_VERSION:-v1}
      # Runtime values for the /.well-known association files.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      IOS_BUYER_BUNDLE_ID: ${IOS_BUYER_BUNDLE_ID:-com.teincfood.app}
      IOS_BUSINESS_BUNDLE_ID: ${IOS_BUSINESS_BUNDLE_ID:-com.teincfood.business}
      ANDROID_BUYER_PACKAGE: ${ANDROID_BUYER_PACKAGE:-com.teincfood.app}
      ANDROID_BUSINESS_PACKAGE: ${ANDROID_BUSINESS_PACKAGE:-com.teincfood.business}
      ANDROID_BUYER_SHA256_FINGERPRINTS: ${ANDROID_BUYER_SHA256_FINGERPRINTS:-}
      ANDROID_BUSINESS_SHA256_FINGERPRINTS: ${ANDROID_BUSINESS_SHA256_FINGERPRINTS:-}
      ANDROID_SHA256_FINGERPRINTS: ${ANDROID_SHA256_FINGERPRINTS:-}
    networks:
      - teinc-internal-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  teinc-internal-net:
    external: true
    # test -> teinc-internal-net, production -> wf8-internal-net
    name: ${SHARED_NETWORK:-teinc-internal-net}