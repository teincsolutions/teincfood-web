name: CI/CD

on:
  push:
    branches: ["main", "test"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: teincsolutions/teincfoodweb

jobs:
  prepare:
    name: Prepare deployment target
    # GitHub-hosted minutes are currently unavailable (billing limit), so this
    # lightweight job runs on any available self-hosted runner. Later jobs use
    # the explicit runner label emitted below.
    runs-on: self-hosted
    outputs:
      target: ${{ steps.target.outputs.target }}
      environment: ${{ steps.target.outputs.environment }}
      runner: ${{ steps.target.outputs.runner }}
      platform: ${{ steps.target.outputs.platform }}
      compose_files: ${{ steps.target.outputs.compose_files }}
      shared_network: ${{ steps.target.outputs.shared_network }}
      web_port: ${{ steps.target.outputs.web_port }}
    steps:
      - name: Select target
        id: target
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo 'target=production' >> "$GITHUB_OUTPUT"
            echo 'environment=production' >> "$GITHUB_OUTPUT"
            echo 'runner=["self-hosted","willfind8"]' >> "$GITHUB_OUTPUT"
            echo 'platform=linux/amd64' >> "$GITHUB_OUTPUT"
            echo 'compose_files=-f docker-compose.yml -f docker-compose.production.yml' >> "$GITHUB_OUTPUT"
            echo 'shared_network=wf8-internal-net' >> "$GITHUB_OUTPUT"
            echo 'web_port=' >> "$GITHUB_OUTPUT"
          else
            echo 'target=test' >> "$GITHUB_OUTPUT"
            echo 'environment=test' >> "$GITHUB_OUTPUT"
            echo 'runner=["self-hosted","teinc-run-1"]' >> "$GITHUB_OUTPUT"
            echo 'platform=linux/arm64' >> "$GITHUB_OUTPUT"
            echo 'compose_files=-f docker-compose.yml' >> "$GITHUB_OUTPUT"
            echo 'shared_network=teinc-internal-net' >> "$GITHUB_OUTPUT"
            echo 'web_port=3001' >> "$GITHUB_OUTPUT"
          fi

  lint-build:
    name: Lint, typecheck & build
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - name: Free disk space on runner
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          if [[ "$TARGET" == "test" ]]; then
            docker system prune -af || true
          else
            # willfind8 hosts production workloads. Only remove build cache and
            # dangling images, never unused tagged images or stopped containers.
            docker builder prune -af || true
            docker image prune -f || true
          fi
          df -h

      - name: Checkout
        run: |
          # Self-hosted workspace persists; previous docker run (as root) may leave
          # root-owned files. Clean via docker (no host sudo needed) then fallback.
          docker run --rm -v "$GITHUB_WORKSPACE:/ws" node:22 sh -c "rm -rf /ws/* /ws/.* 2>/dev/null || true" 2>/dev/null || rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth 1 --branch "${{ github.head_ref || github.ref_name }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.IMAGE_NAME }}.git" .
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      - name: Lint, typecheck & build (in Docker — no host Node needed)
        run: |
          docker run --rm --network host \
            -v "$PWD:/app" \
            -w /app \
            --user "$(id -u):$(id -g)" \
            -e NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}" \
            -e NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
            -e NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            -e NEXT_PUBLIC_WS_URL="${{ vars.NEXT_PUBLIC_WS_URL }}" \
            node:22 \
            sh -c "yarn install --frozen-lockfile && npx tsc --noEmit && npx eslint . && npx next build"
          # --network host lets the build container resolve and reach registries on
          # willfind8, where newly created Docker bridges have no working NAT.

  build-image:
    name: Build & push Docker image
    needs: [prepare, lint-build]
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Free disk space on runner
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          if [[ "$TARGET" == "test" ]]; then
            docker system prune -af || true
          else
            docker builder prune -af || true
            docker image prune -f || true
          fi
          df -h

      - name: Checkout
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/ws" node:22 sh -c "rm -rf /ws/* /ws/.* 2>/dev/null || true" 2>/dev/null || rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth 1 --branch "${{ github.head_ref || github.ref_name }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.IMAGE_NAME }}.git" .
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      - name: Set up Docker Buildx
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          docker buildx create --use --name "teincfoodweb-${TARGET}" \
            --driver docker-container --driver-opt network=host \
            || docker buildx use "teincfoodweb-${TARGET}"
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Generate tags
        id: tags
        run: |
          SHA_TAG="ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          REF_SLUG="$(echo "${{ github.ref_name }}" | tr '/' '-')"
          BRANCH_TAG="ghcr.io/${{ env.IMAGE_NAME }}:${REF_SLUG}"
          echo "tags=${SHA_TAG},${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
          PLATFORM: ${{ needs.prepare.outputs.platform }}
        run: |
          docker buildx build \
            --platform "$PLATFORM" \
            --push \
            $(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/-t /' | tr '\n' ' ') \
            --cache-from type=gha,scope=teincfoodweb-${TARGET} \
            --cache-to type=gha,mode=max,scope=teincfoodweb-${TARGET} \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}" \
            --build-arg NEXT_PUBLIC_BUYER_APP_STORE="${{ vars.NEXT_PUBLIC_BUYER_APP_STORE }}" \
            --build-arg NEXT_PUBLIC_BUYER_PLAY_STORE="${{ vars.NEXT_PUBLIC_BUYER_PLAY_STORE }}" \
            --build-arg NEXT_PUBLIC_BUSINESS_APP_STORE="${{ vars.NEXT_PUBLIC_BUSINESS_APP_STORE }}" \
            --build-arg NEXT_PUBLIC_BUSINESS_PLAY_STORE="${{ vars.NEXT_PUBLIC_BUSINESS_PLAY_STORE }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_ANALYTICS="${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS }}" \
            --build-arg NEXT_PUBLIC_CONTACT_EMAIL="${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || 'noreply@teincsolutions.com' }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_APPLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_TELEMETRY_URL="${{ vars.NEXT_PUBLIC_TELEMETRY_URL }}" \
            --build-arg NEXT_PUBLIC_TELEMETRY_KEY="${{ secrets.NEXT_PUBLIC_TELEMETRY_KEY }}" \
            --build-arg NEXT_PUBLIC_TELEMETRY_ENV="${{ vars.NEXT_PUBLIC_TELEMETRY_ENV || 'production' }}" \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_WS_URL="${{ vars.NEXT_PUBLIC_WS_URL }}" \
            .

  deploy:
    name: Deploy to ${{ needs.prepare.outputs.target }}
    needs: [prepare, build-image]
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/ws" node:22 sh -c "rm -rf /ws/* /ws/.* 2>/dev/null || true" 2>/dev/null || rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth 1 --branch "${{ github.head_ref || github.ref_name }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.IMAGE_NAME }}.git" .
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify Docker network
        env:
          SHARED_NETWORK: ${{ needs.prepare.outputs.shared_network }}
        run: |
          docker network inspect "$SHARED_NETWORK" >/dev/null
          echo "$SHARED_NETWORK is available"

      - name: Deploy
        env:
          APP_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          COMPOSE_FILES: ${{ needs.prepare.outputs.compose_files }}
          SHARED_NETWORK: ${{ needs.prepare.outputs.shared_network }}
          WEB_PORT: ${{ needs.prepare.outputs.web_port }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID }}
          NEXT_PUBLIC_BUYER_APP_STORE: ${{ vars.NEXT_PUBLIC_BUYER_APP_STORE }}
          NEXT_PUBLIC_BUYER_PLAY_STORE: ${{ vars.NEXT_PUBLIC_BUYER_PLAY_STORE }}
          NEXT_PUBLIC_BUSINESS_APP_STORE: ${{ vars.NEXT_PUBLIC_BUSINESS_APP_STORE }}
          NEXT_PUBLIC_BUSINESS_PLAY_STORE: ${{ vars.NEXT_PUBLIC_BUSINESS_PLAY_STORE }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || 'noreply@teincsolutions.com' }}
          NEXT_PUBLIC_TELEMETRY_URL: ${{ vars.NEXT_PUBLIC_TELEMETRY_URL }}
          NEXT_PUBLIC_TELEMETRY_KEY: ${{ secrets.NEXT_PUBLIC_TELEMETRY_KEY }}
          NEXT_PUBLIC_TELEMETRY_ENV: ${{ vars.NEXT_PUBLIC_TELEMETRY_ENV || 'production' }}
          TEINCFOOD_API_BASE_URL: ${{ secrets.TEINCFOOD_API_BASE_URL }}
          TEINCFOOD_API_VERSION: ${{ vars.TEINCFOOD_API_VERSION || 'v1' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUYER_BUNDLE_ID: ${{ vars.IOS_BUYER_BUNDLE_ID || 'com.teincfood.app' }}
          IOS_BUSINESS_BUNDLE_ID: ${{ vars.IOS_BUSINESS_BUNDLE_ID || 'com.teincfood.business' }}
          ANDROID_BUYER_PACKAGE: ${{ vars.ANDROID_BUYER_PACKAGE || 'com.teincfood.app' }}
          ANDROID_BUSINESS_PACKAGE: ${{ vars.ANDROID_BUSINESS_PACKAGE || 'com.teincfood.business' }}
          ANDROID_BUYER_SHA256_FINGERPRINTS: ${{ vars.ANDROID_BUYER_SHA256_FINGERPRINTS }}
          ANDROID_BUSINESS_SHA256_FINGERPRINTS: ${{ vars.ANDROID_BUSINESS_SHA256_FINGERPRINTS }}
          ANDROID_SHA256_FINGERPRINTS: ${{ vars.ANDROID_SHA256_FINGERPRINTS }}
        run: |
          docker pull "$APP_IMAGE"
          docker compose $COMPOSE_FILES up -d --pull always

      - name: Health check
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            if [ "$TARGET" = "production" ]; then
              SITE_URL="https://teincfood.com"
            else
              SITE_URL="https://food.teincsolutions.com"
            fi
          fi
          for i in $(seq 1 30); do
            if curl -sf "$SITE_URL/en" > /dev/null 2>&1; then
              echo "Site is healthy at $SITE_URL"
              exit 0
            fi
            echo "Waiting for site... ($i/30)"
            sleep 2
          done
          echo "Health check failed for $SITE_URL"
          exit 1
