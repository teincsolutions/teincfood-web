name: CI/CD

on:
  push:
    branches: ["main", "test"]
  pull_request:
    branches: ["main", "test"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  lint-build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

  deploy:
    name: Build & Deploy (ARM64)
    runs-on: ubuntu-latest
    needs: lint-build
    if: github.event_name == 'release' && github.event.action == 'published'
    env:
      DEPLOY_TARGET: ${{ github.event.release.target_commitish }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build & Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOY'
            set -e

            REPO_DIR=~/src/teincfoodweb
            COMPOSE_DIR=~/teincfoodweb-deploy

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR" && git fetch && git checkout origin/main
            else
              git clone https://github.com/teincsolutions/TeincFoodWeb.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            docker build -t "teincfood-web:${{ env.RELEASE_TAG }}" \
              --build-arg "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" \
              --build-arg "NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}" \
              --build-arg "NEXT_PUBLIC_GOOGLE_ANALYTICS=${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS }}" \
              --build-arg "NEXT_PUBLIC_BUYER_APP_STORE=${{ secrets.NEXT_PUBLIC_BUYER_APP_STORE }}" \
              --build-arg "NEXT_PUBLIC_BUYER_PLAY_STORE=${{ secrets.NEXT_PUBLIC_BUYER_PLAY_STORE }}" \
              --build-arg "NEXT_PUBLIC_BUSINESS_APP_STORE=${{ secrets.NEXT_PUBLIC_BUSINESS_APP_STORE }}" \
              --build-arg "NEXT_PUBLIC_BUSINESS_PLAY_STORE=${{ secrets.NEXT_PUBLIC_BUSINESS_PLAY_STORE }}" \
              --build-arg "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
              --build-arg "NEXT_PUBLIC_APPLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID }}" \
              .

            cp docker-compose.yml "$COMPOSE_DIR/" 2>/dev/null || mkdir -p "$COMPOSE_DIR" && cp docker-compose.yml "$COMPOSE_DIR/"

            cd "$COMPOSE_DIR"

            APP_IMAGE="teincfood-web:${{ env.RELEASE_TAG }}" \
            WEB_PORT=3001 \
            NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            NEXT_PUBLIC_CONTACT_EMAIL="${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}" \
            NEXT_PUBLIC_GOOGLE_ANALYTICS="${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS }}" \
            NEXT_PUBLIC_BUYER_APP_STORE="${{ secrets.NEXT_PUBLIC_BUYER_APP_STORE }}" \
            NEXT_PUBLIC_BUYER_PLAY_STORE="${{ secrets.NEXT_PUBLIC_BUYER_PLAY_STORE }}" \
            NEXT_PUBLIC_BUSINESS_APP_STORE="${{ secrets.NEXT_PUBLIC_BUSINESS_APP_STORE }}" \
            NEXT_PUBLIC_BUSINESS_PLAY_STORE="${{ secrets.NEXT_PUBLIC_BUSINESS_PLAY_STORE }}" \
            TEINCFOOD_API_BASE_URL="${{ secrets.TEINCFOOD_API_BASE_URL }}" \
            docker compose -p teincfoodweb up -d

            sleep 5
            curl -sf http://localhost:3001/en > /dev/null && echo "HEALTHY"
          DEPLOY
