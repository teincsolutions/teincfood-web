name: CI/CD

on:
  push:
    branches: ["main", "test"]
  pull_request:
    branches: ["main", "test"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: teincsolutions/teincfoodweb

jobs:
  lint-build:
    name: Lint, typecheck & build
    runs-on: [self-hosted, teinc-run-1]
    steps:
      - name: Checkout
        run: |
          # Workspace persists on self-hosted runners — clear it before cloning
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.IMAGE_NAME }}.git" .
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      - name: Setup Node (no sudo — download binary directly)
        run: |
          if command -v node >/dev/null 2>&1 && node --version 2>/dev/null | grep -q "v22\."; then
            echo "Node 22 already available: $(node --version) — $(which node)"
            corepack enable 2>/dev/null || true
            exit 0
          fi
          echo "Node 22 not found, downloading binary without sudo..."
          NODE_VERSION=22.19.0
          ARCH=$(uname -m)
          case "$ARCH" in aarch64|arm64) NODE_ARCH=arm64 ;; *) NODE_ARCH=x64 ;; esac
          echo "Downloading node v${NODE_VERSION} linux-${NODE_ARCH}..."
          mkdir -p "$HOME/.local/node22"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" | tar -xJ -C "$HOME/.local/node22" --strip-components=1
          echo "$HOME/.local/node22/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/node22/bin:$PATH"
          echo "Node now: $(node --version) — $(which node)"
          echo "Yarn: $(yarn --version 2>/dev/null || echo 'yarn not yet')"
          corepack enable 2>/dev/null || npm install -g corepack 2>/dev/null || true
          corepack enable 2>/dev/null || true

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

  build-image:
    name: Build & push Docker image
    runs-on: [self-hosted, teinc-run-1]
    needs: lint-build
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        run: |
          # Workspace persists on self-hosted runners — clear it before cloning
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.IMAGE_NAME }}.git" .
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      - name: Set up QEMU
        run: |
          docker run --rm --privileged tonistiigi/binfmt:latest --install arm64

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name multiarch || docker buildx use multiarch

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Generate tags
        id: tags
        run: |
          SHA_TAG="ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          BRANCH_TAG="ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          TAGS="$SHA_TAG,$BRANCH_TAG"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_TAG="ghcr.io/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}"
            TAGS="$TAGS,$TAG_TAG"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "first_tag=$SHA_TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/arm64 \
            ${{ github.event_name != 'pull_request' && '--push' || '' }} \
            $(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/-t /' | tr '\n' ' ') \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}" \
            --build-arg NEXT_PUBLIC_BUYER_APP_STORE="${{ secrets.NEXT_PUBLIC_BUYER_APP_STORE }}" \
            --build-arg NEXT_PUBLIC_BUYER_PLAY_STORE="${{ secrets.NEXT_PUBLIC_BUYER_PLAY_STORE }}" \
            --build-arg NEXT_PUBLIC_BUSINESS_APP_STORE="${{ secrets.NEXT_PUBLIC_BUSINESS_APP_STORE }}" \
            --build-arg NEXT_PUBLIC_BUSINESS_PLAY_STORE="${{ secrets.NEXT_PUBLIC_BUSINESS_PLAY_STORE }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_ANALYTICS="${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS }}" \
            --build-arg NEXT_PUBLIC_CONTACT_EMAIL="${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || 'hello@teincfood.com' }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_APPLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID }}" \
            .

  deploy:
    name: Deploy to server
    runs-on: [self-hosted, teinc-run-1]
    needs: build-image
    if: github.event_name != 'pull_request'
    permissions:
      packages: read
      contents: read
    env:
      IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
    steps:
      - name: Checkout
        run: |
          # Workspace persists on self-hosted runners — clear it before cloning
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.IMAGE_NAME }}.git" .
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy
        run: |
          docker pull "ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker compose up -d --pull always
        env:
          APP_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          WEB_PORT: 3001
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_BUYER_APP_STORE: ${{ secrets.NEXT_PUBLIC_BUYER_APP_STORE }}
          NEXT_PUBLIC_BUYER_PLAY_STORE: ${{ secrets.NEXT_PUBLIC_BUYER_PLAY_STORE }}
          NEXT_PUBLIC_BUSINESS_APP_STORE: ${{ secrets.NEXT_PUBLIC_BUSINESS_APP_STORE }}
          NEXT_PUBLIC_BUSINESS_PLAY_STORE: ${{ secrets.NEXT_PUBLIC_BUSINESS_PLAY_STORE }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || 'hello@teincfood.com' }}
          TEINCFOOD_API_BASE_URL: ${{ secrets.TEINCFOOD_API_BASE_URL }}

      - name: Health check
        run: |
          SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$SITE_URL" ]; then SITE_URL="https://food.teincsolutions.com"; fi
          for i in $(seq 1 30); do
            if curl -sf "$SITE_URL/en" > /dev/null 2>&1; then
              echo "Site is healthy"
              exit 0
            fi
            echo "Waiting for site... ($i/30)"
            sleep 2
          done
          echo "Health check failed"
          exit 1
