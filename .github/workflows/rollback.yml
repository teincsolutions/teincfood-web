name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. v0.1.0 or commit SHA)"
        required: true
        type: string

concurrency:
  group: ci-CI/CD-rollback
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback to ${{ inputs.tag }}
    runs-on: [self-hosted, teinc-run-1]
    steps:
      - name: Checkout
        run: |
          # Workspace persists on self-hosted runners — clear it before cloning
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/teincsolutions/teincfoodweb.git" .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy
        run: |
          docker pull "ghcr.io/teincsolutions/teincfoodweb:${{ inputs.tag }}"
          docker compose up -d --pull always
        env:
          APP_IMAGE: ghcr.io/teincsolutions/teincfoodweb:${{ inputs.tag }}
          WEB_PORT: 3001
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BUYER_APP_STORE: ${{ secrets.NEXT_PUBLIC_BUYER_APP_STORE }}
          NEXT_PUBLIC_BUYER_PLAY_STORE: ${{ secrets.NEXT_PUBLIC_BUYER_PLAY_STORE }}
          NEXT_PUBLIC_BUSINESS_APP_STORE: ${{ secrets.NEXT_PUBLIC_BUSINESS_APP_STORE }}
          NEXT_PUBLIC_BUSINESS_PLAY_STORE: ${{ secrets.NEXT_PUBLIC_BUSINESS_PLAY_STORE }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          TEINCFOOD_API_BASE_URL: ${{ secrets.TEINCFOOD_API_BASE_URL }}

      - name: Health check
        run: |
          SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$SITE_URL" ]; then SITE_URL="https://food.teincsolutions.com"; fi
          for i in $(seq 1 30); do
            if curl -sf "$SITE_URL/en" > /dev/null 2>&1; then
              echo "Site is healthy"
              exit 0
            fi
            echo "Waiting for site... ($i/30)"
            sleep 2
          done
          echo "Health check failed"
          exit 1
